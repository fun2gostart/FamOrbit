services:
  - type: web
    name: famorbit-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: famorbit-postgres
          property: connectionString

databases:
  - name: famorbit-postgres
    databaseName: familycontrol
    user: familycontrol
    plan: free
